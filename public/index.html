<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, user-scalable=yes">
<meta http-equiv="X-Content-Type-Options" content="nosniff">

<meta http-equiv="Content-Security-Policy"
  content="default-src 'self';
           script-src 'self';
           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
           font-src 'self' https://fonts.gstatic.com;
           img-src 'self' data: blob:;
           media-src 'self' blob:;
           connect-src 'self';
           object-src 'none';
           base-uri 'self';
           form-action 'none';
           frame-ancestors 'none';
           upgrade-insecure-requests;">

<link rel="stylesheet" href="estilazos.css">
<title>EmojiForge</title>
</head>
<body class="no-autenticado">


<!-- ============================================================
     PANTALLA DE LOGIN
     ============================================================ -->
<div id="pantalla-login" class="pantalla-login">

  <h1 data-i18n="titulo">LaMAO</h1>
  <p class="sub" data-i18n="subtitulo">Ponga el gif, imagen, documento, texto o url dentro del emoji, texto o letra</p>

  <div class="login-box">
    <div class="login-titulo" data-i18n="loginTitulo">Entrar</div>

    <div class="row">
      <label data-i18n="loginNombre">Nombre</label>
      <input type="text" id="login-nombre"
             data-i18n-placeholder="loginPlaceholderNombre"
             placeholder="Tu nombre de perfil"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false">
    </div>

    <div class="row">
      <label data-i18n="loginPassword">Contraseña</label>
      <input type="password" id="login-password"
             data-i18n-placeholder="loginPlaceholderPassword"
             placeholder="Tu contraseña"
             autocomplete="new-password">
    </div>

    <div class="btn-row">
      <button class="action big" id="login-go" data-i18n="loginEntrar">Entrar</button>
    </div>

    <div class="btn-row">
      <button class="action alt" id="login-crear" data-i18n="loginCrear">Crear perfil gratuito (5 usos)</button>
    </div>

    <div class="out" id="login-out" data-i18n="loginEsperando">Esperando...</div>
  </div>

</div>

<!-- ============================================================
     NADA IMPORTANTE
     ============================================================ -->
<div id="app">

  <div class="header-usuario">
    <div class="usuario-info">
      <span class="usuario-nombre" id="usuario-nombre">—</span>
      <span class="usuario-rol" id="usuario-rol">—</span>
      <span class="usuario-usos" id="usuario-usos"></span>
    </div>
    <button class="action alt" id="btn-logout" data-i18n="logout">Salir</button>
  </div>

  <nav>
    <button data-tab="P" class="active" data-i18n="tabEmpaquetar">EMPAQUETAR</button>
    <button data-tab="U" data-i18n="tabExtraer">Extraer</button>
    <button data-tab="A" class="tab-admin">Admin</button>
  </nav>

  <section id="P" class="active">
    <div id="pack-items"></div>
    <div class="row">
      <button class="action alt" id="pack-add" style="width:100%" data-i18n="btnAñadir">+ Añadir otro +</button>
    </div>
    <div class="row">
      <label data-i18n="labelCosaBase">Cosa Base</label>
      <input type="text" id="pack-emoji" value="Hola" maxlength="100" style="max-width:90px;text-align:center;font-size:1.5rem">
     
    </div>

    <div class="row">
      <label data-i18n="labelCifrado">Cifrado</label>
      <select id="pack-cifrado">
        <option value="none" data-i18n="optNinguno">Ninguno</option>
        <option value="antes" data-i18n="optAntes">Solo datos</option>
        <option value="despues" data-i18n="optDespues">Solo el payload</option>
        <option value="ambos" data-i18n="optAmbos">Ambos</option>
      </select>
    </div>
    <div class="row" id="pack-row-password" style="display:none">
      <label data-i18n="labelContraseña">Contraseña</label>
      <input type="password" id="pack-password" data-i18n-placeholder="placeholderContraseña" placeholder="Contraseña de cifrado..." autocomplete="new-password">
    </div>
    <div class="row" id="pack-row-iter" style="display:none">
      <label data-i18n="labelIteraciones">Iteraciones</label>
      <input type="number" id="pack-iter" value="5000" min="100" max="100000" style="max-width:140px">
    </div>

    <div class="row"><button class="action big" id="pack-go" data-i18n="btnEmpaquetar">Empaquetar</button></div>
    <div class="emoji-preview" id="pack-prev">—</div>
    <div class="btn-row">
      <button class="action big" id="pack-copy" disabled data-i18n="btnCopiar">📋 Copiar</button>
    </div>
    <div class="btn-row">
      <button class="action alt" id="pack-copy-parts" disabled data-i18n="btnCopiarPartes">📋 Copiar por partes</button>
      <button class="action alt" id="pack-select" disabled data-i18n="btnSeleccionar">👆 Seleccionar todo</button>
    </div>
    <div class="out" id="pack-out" data-i18n="outEsperando">Esperando...</div>
    <div class="stats" id="pack-stats"></div>
  </section>

  <section id="U">
    <div class="row">
      <label data-i18n="labelEmoji">Emoji</label>
      <textarea id="unpack-str" data-i18n-placeholder="placeholderEmoji" placeholder="Pega aquí" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    </div>
    <div class="row">
      <label data-i18n="labelContraseña">Contraseña</label>
      <input type="password" id="unpack-password" data-i18n-placeholder="placeholderContraseñaUnpack" placeholder="Solo si el payload está cifrado..." autocomplete="current-password">
    </div>
    <div class="btn-row">
      <button class="action big" id="unpack-go" data-i18n="btnExtraer">Extraer</button>
    </div>
    <div class="out" id="unpack-out" data-i18n="outEsperandoEmoji">Esperando emoji...</div>
    <div class="stats" id="unpack-stats"></div>
    <div id="unpack-items"></div>
  </section>

  <!-- ================================================
       LO BUENO
       ================================================ -->
 

<!-- ============================================================
     SELECTORES
     ============================================================ -->
<div class="theme-picker" id="langPicker">
  <button type="button" class="theme-picker-btn" id="langPickerBtn" data-i18n="Idiomas">
    🌐 Idioma ▾
  </button>
  <div class="theme-picker-menu" id="langPickerMenu">
    <button type="button" class="theme-picker-option" data-lang="es">Español</button>
    <button type="button" class="theme-picker-option" data-lang="en">English</button>
    <button type="button" class="theme-picker-option" data-lang="de">Deutsch</button>
  </div>
</div>

<div class="theme-picker" id="themePicker">
  <button type="button" class="theme-picker-btn" id="themePickerBtn" data-i18n="Estetica">
    🖥 Estéticas ▾
  </button>
  <div class="theme-picker-menu" id="themePickerMenu">
    <button type="button" class="theme-picker-option" data-theme="retro" data-i18n="Retro"> Retro </button>
    <button type="button" class="theme-picker-option" data-theme="amber" data-i18n="Terminal">Terminal Ámbar (DEC/Wang)</button>
    <button type="button" class="theme-picker-option" data-theme="ibm">IBM (Windows 3.1)</button>
  </div>
</div>

<script src="seguridad.js"></script>
<script src="tapa.js"></script>
<script type="module" src="emo.js"></script>
<script src="admin.js"></script>

</body>
</html>
